[project]
name = "hia"
version = "0.1.0"
description = "Home Intelligent Assistant backend"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "TBD" }
dependencies = [
  "aiohttp>=3.10",
  "duckdb>=1.5.5",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pytz>=2026.3.post1",
  "structlog>=24.4",
  "typer>=0.13",
]

[project.scripts]
hia = "hia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hia"]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hia"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "aiohttp.test_utils"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
