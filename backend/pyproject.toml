[project]
name = "hia"
version = "0.1.0"
description = "Home Intelligent Assistant backend"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "TBD" }
dependencies = [
  "aiohttp>=3.10",
  "duckdb>=1.5.5",
  "fastapi>=0.141.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pytz>=2026.3.post1",
  "sqlalchemy>=2.0.53",
  "structlog>=24.4",
  "typer>=0.13",
  "ulid-transform>=2.2.9",
  "uvicorn[standard]>=0.53.0",
]

[project.scripts]
hia = "hia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hia"]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hia"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "aiohttp.test_utils"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A real CI incident, not a defensive default: a race in
# tests/ha/test_client.py's backpressure test hung indefinitely on GitHub
# Actions' Linux runners (never reproduced locally) and silently burned the
# full 6-hour job-execution ceiling on every push for a day before being
# noticed. `thread` (not the Unix-only `signal` default) so this also protects
# local runs on this Windows dev machine, not just CI. 30s is generous headroom
# over the ~5s the whole suite normally takes.
timeout = 30
timeout_method = "thread"
